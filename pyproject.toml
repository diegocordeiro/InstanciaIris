[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "instanciairis"
version = "0.1.0"
description = "Machine Learning project using FabricaIA template (InstanciaIris)"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "diego", email = "diego.cordeiro@ifpi.edu.br" }
]
license = { text = "MIT" }
keywords = ["machine-learning", "ml", "data-science", "framework"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["src*"]
